; Copy this file to config.ini and fill it in. Keep config.ini private:
; the token lets anyone read the bot's signals.
[copier]
; The OG B0T copy feed.
feed_url = https://ogbot.co.uk/api/public/copy-feed
; The copy feed token (Boss -> Lovable Cloud -> Database -> site_content,
; the row with key copy.feedToken).
token = PASTE_THE_TOKEN_HERE
; Lots per trade. "bot" (recommended): the same lot the bot's test account
; takes on each signal (0.05 to 0.3). Or a number, e.g. 0.02, for that lot
; on every trade (0.01 can't split at TP1).
lot = bot
; true: only prints what it would do. Set to false to trade for real.
dry_run = true
; false (the house rule): no stop at the broker, the copier closes at market.
; true: also puts the bot's stop on the broker as a safety net if the PC goes off.
use_broker_stop = false
; How often to check (seconds).
poll_seconds = 3
; Don't jump into a signal that filled more than this many minutes ago.
max_late_minutes = 10
; Most copied trades open at once.
max_open = 6
; Which markets to copy, and their names in your MT5 Market Watch.
markets = XAUUSD,BTCUSD
symbol_XAUUSD = XAUUSD
symbol_BTCUSD = BTCUSD
; Only if you have more than one MT5 installed: the full path to terminal64.exe.
mt5_path =
